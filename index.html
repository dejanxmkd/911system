<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>911systems — Unit Grouping Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="prototype-shell">
    <section class="units-panel" aria-label="Units prototype">
      <div class="units-toolbar">
        <div class="search-wrap"><span>⌕</span><input id="unit-search" placeholder="Search..." /></div>
        <button class="icon-btn" aria-label="Filters">☷</button>
      </div>

      <div class="units-tabs" id="unit-tabs">
        <button data-tab="available" class="active">Available <span class="count" id="available-count">0</span></button>
        <button data-tab="assigned">Assigned <span class="count" id="assigned-count">0</span></button>
      </div>

      <div class="subfilter" id="subfilter">
        <span>Current status</span>
        <div class="chips"><button class="chip active">All</button><button class="chip">Active</button></div>
      </div>

      <div class="drop-help" id="drop-help">Drop unit on another unit to group</div>
      <div class="units-list" id="units-list"></div>
      <div class="toast" id="toast" role="status"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
