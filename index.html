<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>911systems — Unit Grouping Prototype</title>
  <link rel="stylesheet" href="styles.css?v=unit-cards-3" />
</head>
<body>
  <main class="prototype-page">
    <section class="units-sidebar" aria-label="Units">
      <div class="toolbar-row">
        <label class="search-field"><span class="search-symbol">⌕</span><input id="unit-search" placeholder="Search..." autocomplete="off"></label>
        <button class="icon-button" aria-label="Filters">☷</button>
      </div>
      <div class="unit-tabs" id="unit-tabs">
        <button class="unit-tab active" data-tab="available">Available <span class="count-badge" id="available-count">0</span></button>
        <button class="unit-tab" data-tab="assigned">Assigned <span class="count-badge" id="assigned-count">0</span></button>
      </div>
      <div class="status-filter" id="status-filter"></div>
      <div class="drag-message" id="drag-message" hidden>Drop onto another unit to group</div>
      <div class="units-list" id="units-list"></div>
    </section>

    <aside class="prototype-tools">
      <div class="tool-row"><span>Context</span><div class="context-switch" id="context-switch"><button class="active" data-context="details">CFS details</button><button data-context="map">Map view</button></div></div>
      <button class="tool-button" id="close-cfs">Close CFS</button>
      <button class="tool-button" id="reset-demo">Reset demo</button>
      <div class="logs-title">Logs</div>
      <div id="log-list" class="log-list"></div>
    </aside>
  </main>
  <div class="toast" id="toast"></div>
  <script src="app.js?v=unit-cards-3"></script>
</body>
</html>
