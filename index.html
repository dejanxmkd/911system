<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>911systems — Unit Grouping Prototype</title>
  <link rel="stylesheet" href="styles.css?v=20260818-001" />
</head>
<body>
  <main class="prototype-stage">
    <section class="units-board" aria-label="Units">
      <div class="board-toolbar">
        <label class="search-input">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input id="unit-search" type="search" placeholder="Search..." autocomplete="off" />
        </label>
        <button class="secondary-button filter-trigger" id="filter-trigger" type="button" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M7 12h10M10 19h4"></path></svg>
          Filters
          <span class="count-badge hidden" id="filter-count">0</span>
        </button>
        <div class="filters-popover" id="filters-popover" hidden>
          <button class="filter-row active" data-agency="all">All agencies <span>✓</span></button>
          <button class="filter-row" data-agency="POLICE">Police <span>✓</span></button>
          <button class="filter-row" data-agency="FIRE">Fire <span>✓</span></button>
          <button class="filter-row" data-agency="EMS">EMS <span>✓</span></button>
        </div>
      </div>

      <div class="lifted-tabs" id="unit-tabs" role="tablist" aria-label="Units tabs">
        <button class="lifted-tab active" data-tab="available" role="tab">Available</button>
        <button class="lifted-tab" data-tab="assigned" role="tab">Assigned</button>
        <span class="active-dot" id="active-dot" aria-hidden="true"></span>
      </div>

      <div class="substatus-wrap" id="substatus-wrap"></div>
      <div class="units-list" id="units-list"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260818-001"></script>
</body>
</html>
